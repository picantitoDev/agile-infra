version: "3.8"

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: piero
      POSTGRES_PASSWORD: piero
      POSTGRES_DB: sgi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piero -d sgi"]
      interval: 5s
      timeout: 3s
      retries: 10

  express-api:
    image: agile-dev:latest
    container_name: express-api
    restart: always
    ports:
      - "3000:3000"   # app
      - "5555:5555"   # Prisma Studio (only when you run it)
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://piero:piero@postgres-db:5432/sgi?schema=public
      SESSION_SECRET: secretito
      PORT: 3000
    command: >
      sh -c "
        until nc -z postgres-db 5432; do echo 'Waiting for Postgres...'; sleep 1; done &&
        npx prisma migrate deploy &&
        node app.js
      "
volumes:
  pgdata:
